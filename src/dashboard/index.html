    const entries = (this.setupInfo.agents || this.setupInfo.entries || []);
    const configured = (e) => e && e.state === "unchanged";
    const installed = (e) => e && e.state !== "missing";
    const anyConfigured = entries.some(configured);
    const connected = (o.peers || []).filter((p) => p.connected).length;
    const steps = [
      { id: "daemon", done: true, title: "Daemon is running", desc: `Version ${esc((this.diag && this.diag.version) || (o.status && o.status.version) || "")} on this computer. To keep it running after you sign in, run:`, extra: `<div class="cmd"><code>crosstalk service install</code>${copyBtn("crosstalk service install")}</div>` },
      { id: "team", done: teams.length > 0, title: "Create or join a team", desc: teams.length ? `You are in ${teams.map((t) => `<strong>${esc(t.name)}</strong>`).join(", ")}.` : "Optional for a single computer. Create a team to link your computers, or join with an invitation.", action: `<a class="btn" href="#/teams">${teams.length ? "Manage teams" : "Create or join"}</a>` },
      { id: "agents", done: anyConfigured, title: "Connect your coding agents", desc: "Adds the Crosstalk tools (and, for Claude Code and Codex, lifecycle hooks) to the agent’s own configuration. Existing files are backed up first.", extra: ["claude", "codex", "cursor", "kiro", "opencode"].map((id) => { const e = this.agentEntry(id); const name = providerName(id); if (!e) return ""; return `<div class="row wrap" data-agent="${id}"><strong style="min-width:110px">${name}</strong>${e.state === "missing" ? pill("offline", "not installed") + `<span class="small muted">${esc(e.detail || "")}</span>` : configured(e) ? pill("active", "configured") : pill("pending", e.state === "failed" ? "needs attention" : "not configured")}<span class="spacer"></span>${e.state === "missing" ? "" : `<button class="btn sm ${configured(e) ? "" : "primary"}" data-setup="${id}">${configured(e) ? "Re-apply" : "Configure"}</button>`}</div>${e.state === "failed" ? `<div class="small" style="color:var(--danger)">${esc(e.detail)}</div>` : ""}${id === "codex" && configured(e) ? `<div class="small muted">Codex asks you to review new hooks once: run <code>/hooks</code> in Codex and trust them.</div>` : ""}${id === "cursor" && configured(e) ? `<div class="small muted">MCP only: enable <code>crosstalk</code> under Cursor Settings → MCP; Cursor’s agent reads messages with <code>check_inbox</code>.</div>` : ""}${(id === "kiro" || id === "opencode") && configured(e) ? `<div class="small muted">MCP only: start it from your project folder; its agent reads messages with <code>check_inbox</code>.</div>` : ""}`; }).join("") },
      { id: "sessions", done: sessions.some((s) => s.liveness === "active" || s.liveness === "idle"), title: "Start an agent in your project", desc: sessions.length ? `${sessions.length} session${sessions.length === 1 ? "" : "s"} registered.` : "Open Claude Code or Codex in a project folder. It registers itself the moment it starts; this page updates on its own.", extra: sessions.length ? `<div class="stack" style="gap:6px">${sessions.slice(0, 4).map((s) => `<div class="row">${sessionIdentity(s)}<span class="spacer"></span>${pill(s.liveness)}</div>`).join("")}</div>` : "" },
      { id: "verify", done: !!(o.network && o.network.running) && (teams.length === 0 || connected > 0 || (o.peers || []).length === 0), title: "Verify connectivity", desc: o.network && o.network.running ? `Networking is running${connected ? `, ${connected} teammate machine${connected === 1 ? "" : "s"} connected` : (o.peers || []).length ? ", teammates are currently offline (messages will queue)" : ""}.` : "Networking is not running on this machine.", action: `<button class="btn" id="reverify">Check again</button>` },
      { id: "go", done: (state.convs || []).length > 0, title: "Start collaborating", desc: "Ask one agent to send a proposal to the other. It will find the right session in your project, send the message, and wait for the reply. Anything that needs a decision shows up under Approvals.", action: `<a class="btn primary" href="#/messages">Open messages</a>` },
    ];
    const done = steps.filter((s) => s.done).length;
    const firstOpen = steps.findIndex((s) => !s.done);
    const html = head("Setup", "A few steps to get agents talking to each other.", `<div class="row"><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${steps.length}" aria-valuenow="${done}" aria-label="Setup progress"><div style="width:${(done / steps.length) * 100}%"></div></div><span class="small muted">${done} of ${steps.length}</span></div>`) +
      `<section class="panel"><ol class="steps">${steps.map((s, i) => `<li class="step ${s.done ? "done" : i === firstOpen ? "current" : ""}"><span class="badge" aria-hidden="true">${s.done ? "✓" : i + 1}</span><div><h3>${esc(s.title)} ${s.done ? '<span class="sr-only">(done)</span>' : ""}</h3><p class="muted">${s.desc}</p>${s.extra ? `<div class="detail">${s.extra}</div>` : ""}</div><div>${s.action || ""}</div></li>`).join("")}</ol></section>`;
    if (!setHTML(view, html, "setup")) return;
    view.querySelectorAll("[data-setup]").forEach((b) => (b.onclick = () => this.apply(b.dataset.setup)));
    const rv = $("#reverify"); if (rv) rv.onclick = async () => { await refreshOverview(); await this.load(); toast("Checked"); };
  },
  async apply(id) {
    const e = this.agentEntry(id);
    const files = (e.files || []).filter((f) => f.changed).map((f) => `<li class="mono small">${esc(f.path)}</li>`).join("");
    const ok = await confirmDialog({ title: `Configure ${providerName(id)}?`, ok: "Configure", body: `<p>Crosstalk will add its MCP server and lifecycle hooks${files ? " to these files (each is backed up first)" : ""}:</p>${files ? `<ul style="padding-left:18px">${files}</ul>` : '<p class="muted">Everything is already configured.</p>'}<p class="muted small" style="margin-top:8px">Only entries Crosstalk owns are changed.</p>` });
    if (!ok) return;
    try { await api("setup-apply", { agent: id }); toast(`${providerName(id)} configured. Restart it to pick up the change.`); await this.load(); } catch (err) { toast(err.message, true); }
  },
};


/* Live: the wire, who asked whom and the reply that answered it */
pages.live = {
  msgs: [], seen: new Set(), first: true,
  mount() { this.first = true; this.paint(); this.load().then(() => this.paint()); },
  async load() {
    const pairs = (state.convs || []).slice().sort((x, y) => (y.last_at || 0) - (x.last_at || 0)).slice(0, 12);
    const results = await Promise.all(pairs.map((c) => api("conversation", { session_key: c.a, with: c.b, limit: 60 }).catch(() => null)));
    const byId = new Map();
    results.forEach((r) => (r && r.messages || []).forEach((m) => byId.set(m.id, m)));
    this.msgs = [...byId.values()].sort((x, y) => (x.created_at - y.created_at) || String(x.id).localeCompare(String(y.id)));
    this.loaded = true;
  },
  lanes(msgs) {
    const order = [];
    msgs.forEach((m) => [m.sender_key, m.recipient_key].forEach((k) => { if (!order.includes(k)) order.push(k); }));
    const agents = order.filter((k) => k !== "human").slice(0, 6);
    return order.includes("human") ? [...agents, "human"] : agents;
  },
  paint() {
    if (state.page !== "live") return;
    const o = state.overview || {};
    const pend = (o.questions || []).length;
    const shown = this.msgs.slice(-14);
    const lanes = this.lanes(shown);
    const ids = new Set(this.msgs.map((m) => m.id));
    const matched = this.msgs.filter((m) => m.reply_to && ids.has(m.reply_to)).length;
    const agentCount = lanes.filter((k) => k !== "human").length;
    const readings = `<div class="readings" role="region" aria-label="Readings">
      <div class="reading-cell"><div class="label">Agents on the wire</div><span class="reading">${agentCount}</span><div class="note">${esc(lanes.filter((k) => k !== "human").map((k) => providerName(providerOf(state.sessions.get(k) || {}))).filter((v, i, a) => a.indexOf(v) === i).join(", ") || "none yet")}</div></div>
      <div class="reading-cell"><div class="label">Messages</div><span class="reading">${this.msgs.length}</span><div class="note">in the latest conversations</div></div>
      <div class="reading-cell"><div class="label">Replies matched</div><span class="reading">${matched}</span><div class="note">each tied to the request it answers</div></div>
      <div class="reading-cell${pend ? " person" : ""}"><div class="label">Waiting on you</div><span class="reading">${pend}</span><div class="note">${pend ? `<a href="#/approvals">Review approvals</a>` : "nothing to decide"}</div></div>
    </div>`;
    let wire;
    if (!this.loaded) wire = loading(4);
    else if (!shown.length) wire = `<section class="panel">${empty("The wire is quiet", "When agents message each other, every request and its reply is drawn here as it happens.")}</section>`;
    else {
      const avail = Math.max(lanes.length * 150, (view.clientWidth || 1000) - 2);
      const W = Math.floor(avail / lanes.length), R = 56, top = 36;
      const width = lanes.length * W, height = top + shown.length * R + 10;
      const cx = (k) => lanes.indexOf(k) * W + W / 2;
      const spines = lanes.map((k) => `<line class="spine" x1="${cx(k)}" y1="0" x2="${cx(k)}" y2="${height}"/>`).join("");
      const rows = shown.map((m, i) => {
        if (!lanes.includes(m.sender_key) || !lanes.includes(m.recipient_key)) return "";
        const kind = m.sender_key === "human" ? "person" : (m.reply_to && ids.has(m.reply_to) ? "reply" : "ask");
        const y = top + i * R, x1 = cx(m.sender_key), x2 = cx(m.recipient_key);
        const dir = x2 > x1 ? 1 : -1, tip = x2 - dir * 4;
        const label = String(m.body || "").replace(/\s+/g, " ");
        const room = Math.max(18, Math.floor(Math.abs(x2 - x1) / 7.2));
        const text = label.length > room ? label.slice(0, room - 1) + "…" : label;
        const mid = (x1 + x2) / 2;
        const fresh = !this.first && !this.seen.has(m.id) ? " fresh" : "";
        return `<g class="msgrow${fresh}"><title>${esc(nameOf(m.sender_key))} to ${esc(nameOf(m.recipient_key))}: ${esc(label)}</title>
          <text x="${mid}" y="${y - 8}" text-anchor="middle">${esc(text)}</text>
          <line class="arrow ${kind}" x1="${x1}" y1="${y}" x2="${tip}" y2="${y}"/>
          <polygon class="head ${kind}" points="${x2},${y} ${x2 - dir * 9},${y - 5} ${x2 - dir * 9},${y + 5}"/>
          <text class="t" x="${x1 + dir * 8}" y="${y + 16}" text-anchor="${dir > 0 ? "start" : "end"}">${esc(new Date(m.created_at * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }))}${m.reply_to && ids.has(m.reply_to) ? " · reply" : ""}</text></g>`;
      }).join("");
      const laneHtml = lanes.map((k) => { const s = state.sessions.get(k); const p = s ? providerOf(s) : ""; return `<div class="lane ${k === "human" ? "human" : "agent"}"><div class="lane-name">${esc(k === "human" ? "You" : providerName(p))}</div><div class="lane-key trunc" title="${esc(k)}">${esc(k === "human" ? "the human" : k)}</div></div>`; }).join("");
      wire = `<section class="panel wire" aria-label="Message wire"><div class="wire-lanes" style="grid-template-columns:repeat(${lanes.length},minmax(0,1fr))">${laneHtml}</div>
        <div class="wire-body"><svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="Sequence of the latest ${shown.length} messages">${spines}${rows}</svg></div>
        <div class="wire-legend"><span class="k">Request</span><span class="k reply">Reply, matched to its request</span><span class="k person">From you</span></div></section>`;
    }
    const html = head("Live", "Every agent on one wire. A request, the reply that answers it, and what is waiting on you.") + readings + wire;
    setHTML(view, html, "live");
    this.msgs.forEach((m) => this.seen.add(m.id));
    if (this.loaded) this.first = false;
  },
  tick() { if (state.page !== "live") return; this.load().then(() => this.paint()); },
};

/* ---------- boot ---------- */
window.addEventListener("hashchange", route);
async function tick() {
  await refreshOverview();
  const p = pages[state.page];
  if (state.page === "overview") { await pages.messages.loadConvs(); p.paint(); }
  else if (state.page === "messages") pages.messages.tick();
  else if (state.page === "approvals") p.tick();
  else if (state.page === "live") { await pages.messages.loadConvs(); p.tick(); }
  else if (state.page === "sessions" || state.page === "teams") { if (document.activeElement && ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName) && state.page === "teams") return; p.paint(); }
  else if (state.page === "setup") p.load();
}
(async function boot() {
  await refreshOverview();
  try { await pages.messages.loadConvs(); } catch {}
  route();
  setInterval(tick, 4000);
})();
</script>
