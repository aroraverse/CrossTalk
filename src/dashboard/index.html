:root {
  color-scheme: dark;
  --space-3xs: 2px; --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px;
  --text-xs: 0.75rem; --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.2rem; --text-xl: 1.44rem; --text-2xl: 1.728rem; --text-3xl: 2.488rem;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --dur-micro: 120ms; --dur-short: 220ms; --dur-long: 420ms;
  --color-paper: oklch(17% 0.008 250); --color-paper-2: oklch(21% 0.009 250); --color-paper-3: oklch(13.5% 0.007 250);
  --color-ink: oklch(95% 0.005 250); --color-ink-2: oklch(83% 0.008 250); --color-muted: oklch(71% 0.01 250);
  --color-rule: oklch(31% 0.01 250); --color-rule-2: oklch(42% 0.012 250);
  --color-accent: oklch(82% 0.15 80); --color-accent-ink: oklch(18% 0.04 75); --color-accent-soft: oklch(29% 0.05 80); --color-focus: oklch(82% 0.15 80);
  --color-cool: oklch(77% 0.12 245); --color-cool-soft: oklch(29% 0.05 245);
  --color-ok: oklch(76% 0.15 150); --color-ok-soft: oklch(24.5% 0.03 150); --color-bad: oklch(70% 0.17 25); --color-bad-soft: oklch(24.5% 0.035 25);
  --color-scrim: oklch(10% 0.006 250 / 0.72);
  --font-display: "Host Grotesk", ui-sans-serif, system-ui, sans-serif; --font-body: var(--font-display);
  --font-outlier: "Atkinson Hyperlegible Mono", ui-monospace, monospace;
  --radius-card: 10px; --radius-pill: 6px; --radius-chip: 4px; --rule-hair: 1px;
  --tracking-display: -0.03em; --display-weight: 500;
  /* names the page script still reads */
  --border: var(--color-rule); --warn: var(--color-accent); --danger: var(--color-bad);
}
@media (prefers-color-scheme: dark) { :root { color-scheme: dark; } }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { overflow-x: clip; }
html { height: 100%; scrollbar-color: var(--color-rule-2) var(--color-paper); }
strong, b, th { font-weight: 500; }
body { height: 100%; margin: 0; font-synthesis: none; background: var(--color-paper); color: var(--color-ink); font-family: var(--font-body); font-size: var(--text-md); line-height: 1.5; -webkit-font-smoothing: antialiased; caret-color: var(--color-accent); }
::selection { background: color-mix(in oklab, var(--color-accent) 25%, transparent); }
a { color: var(--color-ink); text-decoration-color: var(--color-rule-2); text-decoration-thickness: 1px; text-underline-offset: 0.18em; transition: color var(--dur-micro) var(--ease-out), text-decoration-color var(--dur-micro) var(--ease-out); }
a:hover { color: var(--color-accent); text-decoration-color: var(--color-accent); }
button, input, select, textarea { font: inherit; color: inherit; }
code, .mono { font-family: var(--font-outlier); font-size: var(--text-sm); font-variant-numeric: tabular-nums slashed-zero; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: var(--display-weight); font-synthesis: none; letter-spacing: var(--tracking-display); line-height: 1.1; text-wrap: balance; overflow-wrap: break-word; min-width: 0; }
h1 { font-size: var(--text-2xl); } h2 { font-size: var(--text-md); letter-spacing: -0.01em; } h3 { font-size: var(--text-md); letter-spacing: -0.01em; }
p { margin: 0; text-wrap: pretty; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; border-radius: var(--radius-chip); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip { position: absolute; left: var(--space-xs); top: -48px; background: var(--color-paper-2); color: var(--color-ink); padding: var(--space-xs) var(--space-sm); border: var(--rule-hair) solid var(--color-rule-2); border-radius: var(--radius-pill); z-index: 100; }
.skip:focus { top: var(--space-xs); }

/* Shell */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: var(--space-lg) var(--space-sm) var(--space-md); border-right: var(--rule-hair) solid var(--color-rule); background: var(--color-paper-3); }
.brand { display: flex; align-items: center; gap: var(--space-xs); padding: 0 var(--space-xs) var(--space-lg); font-size: var(--text-lg); font-weight: 500; letter-spacing: -0.02em; }
.brand svg { width: 22px; height: 22px; color: var(--color-cool); flex: none; }
.nav { display: flex; flex-direction: column; gap: var(--space-3xs); }
.nav a { display: flex; align-items: center; gap: var(--space-sm); min-height: 40px; padding: 0 var(--space-sm); border: var(--rule-hair) solid transparent; border-radius: var(--radius-pill); color: var(--color-muted); text-decoration: none; font-size: var(--text-sm); font-weight: 500; transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out), border-color var(--dur-micro) var(--ease-out); }
.nav a svg { width: 16px; height: 16px; flex: none; }
.nav a:hover { color: var(--color-ink); background: var(--color-paper); }
.nav a:active { background: var(--color-paper-2); }
.nav a[aria-current="page"] { color: var(--color-ink); background: var(--color-paper-2); border-color: var(--color-rule); }
.nav a[aria-current="page"] svg { color: var(--color-cool); }
.nav .count { margin-left: auto; min-width: 22px; padding: 0 var(--space-2xs); text-align: center; border-radius: var(--radius-chip); font-family: var(--font-outlier); font-size: var(--text-xs); line-height: 20px; background: var(--color-paper-2); color: var(--color-muted); border: var(--rule-hair) solid var(--color-rule); }
.nav .count.alert { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-ink); }
.side-foot { margin-top: auto; padding: var(--space-sm) var(--space-xs) 0; border-top: var(--rule-hair) solid var(--color-rule); color: var(--color-muted); font-size: var(--text-sm); }
.conn { display: flex; align-items: center; gap: var(--space-xs); }
.dot { display: none; }
.main { min-width: 0; max-width: 100%; padding: var(--space-xl) var(--space-xl) var(--space-2xl); }
.page { max-width: 1240px; margin: 0 auto; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-md); flex-wrap: wrap; margin-bottom: var(--space-lg); }
.page-head p { color: var(--color-muted); margin-top: var(--space-2xs); max-width: 64ch; }
.actions { display: flex; gap: var(--space-xs); flex-wrap: wrap; align-items: center; }

/* Panels: hairline surfaces cut from one sheet */
.panel { background: var(--color-paper-2); color: var(--color-ink); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); min-width: 0; }
.panel > header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm); min-height: 48px; padding: var(--space-xs) var(--space-md); border-bottom: var(--rule-hair) solid var(--color-rule); }
.panel > header p { color: var(--color-muted); font-size: var(--text-sm); }
.panel > header a { font-size: var(--text-sm); color: var(--color-muted); }
.panel .body { padding: var(--space-md); }
.grid { display: grid; gap: var(--space-md); }
.grid.two { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); }
.grid.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stack { display: flex; flex-direction: column; gap: var(--space-md); }
.muted { color: var(--color-muted); } .faint { color: var(--color-muted); } .small { font-size: var(--text-sm); }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row { display: flex; align-items: center; gap: var(--space-sm); }
.row.wrap { flex-wrap: wrap; }
.spacer { flex: 1; }
hr { border: 0; border-top: var(--rule-hair) solid var(--color-rule); }

/* Readings: what the network measured, set large */
.readings { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--rule-hair); background: var(--color-rule); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); overflow: hidden; margin-bottom: var(--space-md); }
.reading-cell { background: var(--color-paper-2); padding: var(--space-md) var(--space-md) var(--space-sm); min-width: 0; }
.reading-cell .label { font-size: var(--text-sm); color: var(--color-muted); }
.reading { display: block; margin-top: var(--space-2xs); font-family: var(--font-outlier); font-size: var(--text-3xl); font-weight: 400; letter-spacing: -0.04em; line-height: 1; color: var(--color-ink); font-variant-numeric: tabular-nums slashed-zero; }
.reading-cell.person .reading { color: var(--color-accent); }
.reading-cell .note { margin-top: var(--space-xs); font-size: var(--text-sm); color: var(--color-muted); }

/* Attention strip */
.attention { display: flex; flex-direction: column; gap: var(--space-xs); margin-bottom: var(--space-md); }
.notice { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-sm); min-height: 48px; padding: var(--space-xs) var(--space-md); border-radius: var(--radius-card); border: var(--rule-hair) solid var(--color-rule); background: var(--color-paper-2); }
.notice.warn { background: var(--color-accent-soft); border-color: color-mix(in oklab, var(--color-accent) 40%, var(--color-rule)); }
.notice.warn strong { color: var(--color-accent); }
.notice.ok { background: var(--color-paper-2); }
.notice.ok strong { color: var(--color-ok); }
.notice.bad { background: var(--color-bad-soft); border-color: color-mix(in oklab, var(--color-bad) 40%, var(--color-rule)); }
.notice strong { font-weight: 500; }

/* Controls: the pair, an amber fill beside a hairline outline */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs); min-height: 36px; padding: 0 var(--space-md); border-radius: var(--radius-pill); border: var(--rule-hair) solid var(--color-rule-2); background: var(--color-paper-2); color: var(--color-ink); cursor: pointer; font-size: var(--text-sm); font-weight: 500; line-height: 1.2; text-decoration: none; transition: background-color var(--dur-micro) var(--ease-out), border-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out); }
.btn:hover { background: var(--color-paper); border-color: var(--color-muted); color: var(--color-ink); }
.btn:active { background: var(--color-paper-3); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-ink); }
.btn.primary:hover { background: color-mix(in oklab, var(--color-accent) 88%, var(--color-ink)); border-color: color-mix(in oklab, var(--color-accent) 88%, var(--color-ink)); color: var(--color-accent-ink); }
.btn.primary:active { background: color-mix(in oklab, var(--color-accent) 82%, var(--color-paper-3)); }
.btn.danger { color: var(--color-bad); border-color: color-mix(in oklab, var(--color-bad) 45%, var(--color-rule)); }
.btn.danger:hover { background: var(--color-bad-soft); color: var(--color-bad); }
.btn.danger.solid { background: var(--color-bad); border-color: var(--color-bad); color: var(--color-paper-3); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--color-muted); }
.btn.ghost:hover { background: var(--color-paper); color: var(--color-ink); }
.btn.sm { min-height: 32px; padding: 0 var(--space-sm); font-size: var(--text-sm); }
label.field { display: flex; flex-direction: column; gap: var(--space-2xs); font-weight: 500; font-size: var(--text-sm); color: var(--color-ink-2); }
label.field .hint { font-weight: 400; color: var(--color-muted); }
input[type=text], input[type=search], select, textarea { width: 100%; min-height: 40px; padding: var(--space-xs) var(--space-sm); border: var(--rule-hair) solid var(--color-rule-2); border-radius: var(--radius-pill); background: var(--color-paper-3); color: var(--color-ink); transition: border-color var(--dur-micro) var(--ease-out); }
input[type=text]:hover, input[type=search]:hover, select:hover, textarea:hover { border-color: var(--color-muted); }
textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
input::placeholder, textarea::placeholder { color: var(--color-muted); }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 0; border-color: var(--color-accent); }
input[type=checkbox] { accent-color: var(--color-accent); width: 16px; height: 16px; }
.seg { display: inline-flex; border: var(--rule-hair) solid var(--color-rule-2); border-radius: var(--radius-pill); overflow: hidden; background: var(--color-paper-2); }
.seg button { border: 0; background: transparent; min-height: 34px; padding: 0 var(--space-md); cursor: pointer; color: var(--color-muted); font-size: var(--text-sm); font-weight: 500; transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out); }
.seg button + button { border-left: var(--rule-hair) solid var(--color-rule-2); }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--color-cool-soft); color: var(--color-ink); }
.seg button:hover { color: var(--color-ink); }
.seg button:active { background: var(--color-paper-3); }

/* Tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
th { text-align: left; font-weight: 500; font-size: var(--text-sm); color: var(--color-muted); padding: var(--space-xs) var(--space-md); border-bottom: var(--rule-hair) solid var(--color-rule); white-space: nowrap; background: var(--color-paper-2); }
td { white-space: nowrap; padding: var(--space-sm) var(--space-md); border-bottom: var(--rule-hair) solid var(--color-rule); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr { transition: background-color var(--dur-micro) var(--ease-out); }
tbody tr:hover td { background: var(--color-paper); }
td.num, th.num { text-align: right; font-family: var(--font-outlier); font-variant-numeric: tabular-nums slashed-zero; color: var(--color-muted); }
td .trunc, td .bubble { white-space: normal; }

/* Chips carry state only */
.pill { display: inline-flex; align-items: center; min-height: 22px; padding: 0 var(--space-xs); border-radius: var(--radius-chip); border: var(--rule-hair) solid var(--color-rule-2); font-size: var(--text-xs); font-weight: 500; background: var(--color-paper); color: var(--color-ink-2); white-space: nowrap; line-height: 1.6; }
.pill.active, .pill.connected, .pill.read, .pill.delivered.good { background: var(--color-ok-soft); border-color: color-mix(in oklab, var(--color-ok) 35%, var(--color-rule)); color: var(--color-ok); }
.pill.idle, .pill.sent { background: var(--color-cool-soft); border-color: color-mix(in oklab, var(--color-cool) 35%, var(--color-rule)); color: var(--color-cool); }
.pill.stale, .pill.pending, .pill.queued, .pill.connecting { background: var(--color-accent-soft); border-color: color-mix(in oklab, var(--color-accent) 35%, var(--color-rule)); color: var(--color-accent); }
.pill.offline, .pill.left { background: var(--color-paper); color: var(--color-muted); }
.pill.revoked, .pill.failed { background: var(--color-bad-soft); border-color: color-mix(in oklab, var(--color-bad) 35%, var(--color-rule)); color: var(--color-bad); }
.tag { display: inline-block; padding: 0 var(--space-2xs); border-radius: var(--radius-chip); border: var(--rule-hair) solid var(--color-rule-2); font-size: var(--text-xs); font-weight: 500; background: var(--color-paper); color: var(--color-ink-2); line-height: 1.6; }
.tag.claude, .tag.codex, .tag.cursor, .tag.kiro, .tag.opencode { background: var(--color-cool-soft); border-color: color-mix(in oklab, var(--color-cool) 30%, var(--color-rule)); color: var(--color-cool); }
.tag.human { background: var(--color-accent-soft); border-color: color-mix(in oklab, var(--color-accent) 30%, var(--color-rule)); color: var(--color-accent); }
.tag.admin { background: var(--color-paper); color: var(--color-ink); }
.avatar { width: 32px; height: 32px; border-radius: var(--radius-pill); display: grid; place-items: center; font-size: var(--text-xs); font-weight: 500; background: var(--color-paper); color: var(--color-ink-2); border: var(--rule-hair) solid var(--color-rule-2); flex: none; }
.avatar.claude, .avatar.codex, .avatar.cursor, .avatar.kiro, .avatar.opencode { color: var(--color-cool); border-color: color-mix(in oklab, var(--color-cool) 35%, var(--color-rule)); background: var(--color-cool-soft); }
.avatar.human { color: var(--color-accent-ink); background: var(--color-accent); border-color: var(--color-accent); }

/* Lists */
.list { list-style: none; margin: 0; padding: 0; }
.list > li { border-bottom: var(--rule-hair) solid var(--color-rule); }
.list > li:last-child { border-bottom: 0; }
.list-btn { display: flex; align-items: center; gap: var(--space-sm); width: 100%; min-height: 56px; padding: var(--space-sm) var(--space-md); border: 0; background: transparent; text-align: left; cursor: pointer; transition: background-color var(--dur-micro) var(--ease-out); }
.list-btn:hover { background: var(--color-paper); }
.list-btn:active { background: var(--color-paper-3); }
.list-btn[aria-current="true"] { background: var(--color-paper-3); box-shadow: inset 0 0 0 var(--rule-hair) var(--color-rule-2); }
.unread-dot { min-width: 8px; height: 8px; border-radius: 2px; background: var(--color-cool); flex: none; }

/* Messages */
.mail { display: grid; grid-template-columns: 340px minmax(0, 1fr); height: calc(100vh - 170px); min-height: 480px; gap: var(--space-md); }
.mail > .panel { display: flex; flex-direction: column; overflow: hidden; }
.mail .scroll { overflow-y: auto; flex: 1; min-height: 0; }
.mail .tools { padding: var(--space-sm); border-bottom: var(--rule-hair) solid var(--color-rule); display: flex; flex-direction: column; gap: var(--space-xs); }
.thread-head { display: flex; align-items: center; gap: var(--space-sm); min-height: 56px; padding: var(--space-sm) var(--space-md); border-bottom: var(--rule-hair) solid var(--color-rule); }
.msgs { padding: var(--space-md); display: flex; flex-direction: column; gap: var(--space-md); overflow-y: auto; }
.msg { max-width: 760px; }
.msg .meta { display: flex; align-items: center; gap: var(--space-xs); margin-bottom: var(--space-2xs); font-size: var(--text-sm); color: var(--color-muted); }
.msg .meta .who { font-weight: 500; color: var(--color-cool); }
.msg.human .meta .who { color: var(--color-accent); }
.msg .bubble { padding: var(--space-sm) var(--space-md); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); background: var(--color-paper-3); white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
.msg.human .bubble { background: var(--color-accent-soft); border-color: color-mix(in oklab, var(--color-accent) 35%, var(--color-rule)); }
.msg .replyto { font-size: var(--text-sm); color: var(--color-muted); padding: var(--space-2xs) var(--space-xs); margin-bottom: var(--space-2xs); border: var(--rule-hair) dashed var(--color-rule-2); border-radius: var(--radius-chip); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg .state { font-size: var(--text-xs); color: var(--color-muted); margin-top: var(--space-2xs); font-family: var(--font-outlier); }
.composer { border-top: var(--rule-hair) solid var(--color-rule); padding: var(--space-sm) var(--space-md); display: flex; flex-direction: column; gap: var(--space-xs); background: var(--color-paper-2); }
.composer textarea { min-height: 64px; }

/* Approvals: a person's decision, in amber */
.approval { padding: var(--space-md); border-bottom: var(--rule-hair) solid var(--color-rule); }
.approval:last-child { border-bottom: 0; }
.approval.pending { background: color-mix(in oklab, var(--color-accent-soft) 45%, var(--color-paper-2)); }
.approval .q { font-size: var(--text-lg); line-height: 1.4; letter-spacing: -0.01em; margin: var(--space-sm) 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.ctx { margin: var(--space-xs) 0 var(--space-sm); font-size: var(--text-sm); }
.ctx summary { cursor: pointer; color: var(--color-muted); min-height: 32px; display: flex; align-items: center; }
.ctx summary:hover { color: var(--color-ink); }
.ctx ul { margin: var(--space-xs) 0 0; padding: var(--space-sm); list-style: none; background: var(--color-paper-3); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-pill); display: flex; flex-direction: column; gap: var(--space-xs); }
.decision { display: flex; gap: var(--space-xs); flex-wrap: wrap; align-items: flex-start; }
.custom { margin-top: var(--space-sm); display: flex; flex-direction: column; gap: var(--space-xs); }

/* History */
.hit { padding: var(--space-md); border-bottom: var(--rule-hair) solid var(--color-rule); }
.hit:last-child { border-bottom: 0; }
.hit .ctx-line { color: var(--color-muted); font-size: var(--text-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hit mark { background: var(--color-accent-soft); color: var(--color-accent); border-radius: 2px; padding: 0 var(--space-3xs); }
.filters { display: grid; grid-template-columns: minmax(0, 2fr) repeat(3, minmax(0, 1fr)) auto; gap: var(--space-sm); align-items: end; }

/* Setup steps */
.steps { list-style: none; margin: 0; padding: 0; counter-reset: step; }
.step { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: var(--space-md); padding: var(--space-md); border-bottom: var(--rule-hair) solid var(--color-rule); align-items: start; }
.step:last-child { border-bottom: 0; }
.step .badge { width: 28px; height: 28px; border-radius: var(--radius-pill); display: grid; place-items: center; font-family: var(--font-outlier); font-size: var(--text-sm); border: var(--rule-hair) solid var(--color-rule-2); color: var(--color-muted); }
.step.done .badge { background: var(--color-ok-soft); border-color: color-mix(in oklab, var(--color-ok) 45%, var(--color-rule)); color: var(--color-ok); }
.step.current .badge { border-color: var(--color-accent); color: var(--color-accent); }
.step h3 { margin-bottom: var(--space-2xs); }
.step .detail { margin-top: var(--space-xs); display: flex; flex-direction: column; gap: var(--space-xs); }
.progress { height: 6px; background: var(--color-paper-3); border: var(--rule-hair) solid var(--color-rule); border-radius: 3px; overflow: hidden; min-width: 160px; }
.progress > div { height: 100%; background: var(--color-ok); }
.cmd { display: flex; align-items: center; gap: var(--space-xs); padding: var(--space-2xs) var(--space-2xs) var(--space-2xs) var(--space-sm); background: var(--color-paper-3); border-radius: var(--radius-pill); border: var(--rule-hair) solid var(--color-rule); }
.cmd code { flex: 1; overflow-x: auto; white-space: nowrap; }

/* The wire: who asked whom, and the reply that answered */
.wire { position: relative; }
.wire-lanes { display: grid; gap: var(--rule-hair); background: var(--color-rule); border-bottom: var(--rule-hair) solid var(--color-rule); }
.lane { background: var(--color-paper-2); padding: var(--space-sm) var(--space-sm); min-width: 0; text-align: center; }
.lane .lane-name { font-weight: 500; font-size: var(--text-sm); }
.lane .lane-key { font-family: var(--font-outlier); font-size: var(--text-xs); color: var(--color-muted); }
.lane.agent .lane-name { color: var(--color-cool); }
.lane.human .lane-name { color: var(--color-accent); }
.wire-body { position: relative; background: var(--color-paper-3); overflow-x: auto; }
.wire-body svg { display: block; max-width: none; }
.wire-body .spine { stroke: var(--color-rule); stroke-width: 1; }
.wire-body .ask { stroke: var(--color-cool); }
.wire-body .reply { stroke: var(--color-ok); }
.wire-body .person { stroke: var(--color-accent); }
.wire-body .arrow { fill: none; stroke-width: 1.5; }
.wire-body .head { stroke: none; }
.wire-body .head.ask { fill: var(--color-cool); } .wire-body .head.reply { fill: var(--color-ok); } .wire-body .head.person { fill: var(--color-accent); }
.wire-body text { font-family: var(--font-body); font-size: 13px; fill: var(--color-ink-2); }
.wire-body text.t { font-family: var(--font-outlier); font-size: 11px; fill: var(--color-muted); }
.wire-body .fresh .arrow { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw var(--dur-long) var(--ease-out) forwards; }
.wire-body .fresh text, .wire-body .fresh .head { opacity: 0; animation: appear var(--dur-short) var(--ease-out) var(--dur-short) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes appear { to { opacity: 1; } }
.wire-legend { display: flex; gap: var(--space-md); flex-wrap: wrap; padding: var(--space-sm) var(--space-md); font-size: var(--text-sm); color: var(--color-muted); border-top: var(--rule-hair) solid var(--color-rule); }
.wire-legend .k { display: inline-flex; align-items: center; gap: var(--space-xs); }
.wire-legend .k::before { content: ""; width: 18px; height: 0; border-top: 2px solid var(--color-cool); }
.wire-legend .k.reply::before { border-top-color: var(--color-ok); }
.wire-legend .k.person::before { border-top-color: var(--color-accent); }

/* States */
.empty { padding: var(--space-xl) var(--space-lg); text-align: center; color: var(--color-muted); }
.empty strong { display: block; color: var(--color-ink); margin-bottom: var(--space-2xs); font-weight: 500; }
.error-box { padding: var(--space-sm) var(--space-md); background: var(--color-bad-soft); color: var(--color-bad); border: var(--rule-hair) solid color-mix(in oklab, var(--color-bad) 35%, var(--color-rule)); border-radius: var(--radius-card); }
.skeleton { height: 14px; border-radius: var(--radius-chip); background: var(--color-paper); animation: pulse 1.4s var(--ease-out) infinite alternate; }
@keyframes pulse { from { opacity: 1; } to { opacity: .45; } }
.toasts { position: fixed; right: var(--space-md); bottom: var(--space-md); display: flex; flex-direction: column; gap: var(--space-xs); z-index: 60; max-width: min(420px, calc(100% - 32px)); }
.toast { padding: var(--space-sm) var(--space-md); border-radius: var(--radius-card); background: var(--color-ink); color: var(--color-paper-3); }
.toast.bad { background: var(--color-bad); color: var(--color-paper-3); }
dialog { border: var(--rule-hair) solid var(--color-rule-2); border-radius: var(--radius-card); background: var(--color-paper-2); color: var(--color-ink); padding: 0; width: min(520px, calc(100% - 32px)); }
dialog::backdrop { background: var(--color-scrim); }
dialog .dlg { padding: var(--space-lg); display: flex; flex-direction: column; gap: var(--space-sm); }
dialog .dlg-foot { display: flex; justify-content: flex-end; gap: var(--space-xs); margin-top: var(--space-2xs); }
details.member { border-top: var(--rule-hair) solid var(--color-rule); }
details.member > summary { cursor: pointer; min-height: 48px; padding: var(--space-sm) var(--space-md); display: flex; align-items: center; gap: var(--space-sm); list-style: none; }
details.member > summary:hover { background: var(--color-paper); }
details.member > summary::-webkit-details-marker { display: none; }
details.member > summary::before { content: "›"; color: var(--color-muted); transition: transform var(--dur-micro) var(--ease-out); }
details.member[open] > summary::before { transform: rotate(90deg); }

@media (max-width: 1040px) {
  .grid.two, .grid.even { grid-template-columns: minmax(0, 1fr); }
  .filters { grid-template-columns: 1fr 1fr; }
  .mail { grid-template-columns: 280px minmax(0, 1fr); }
  .readings { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; flex-direction: row; align-items: center; gap: var(--space-xs); padding: var(--space-xs) var(--space-sm); border-right: 0; border-bottom: var(--rule-hair) solid var(--color-rule); overflow-x: auto; }
  .brand { padding: 0 var(--space-xs) 0 0; } .brand span { display: none; }
  .nav { flex-direction: row; flex: none; } .nav a span.label { display: none; } .nav a { padding: 0 var(--space-sm); min-height: 44px; }
  .nav .count { margin-left: var(--space-3xs); }
  .side-foot { display: none; }
  .main { padding: var(--space-md) var(--space-md) var(--space-xl); }
  .page-head { flex-direction: column; align-items: flex-start; }
  .mail { grid-template-columns: minmax(0, 1fr); height: auto; }
  .mail .scroll { max-height: 60vh; }
  .hide-sm { display: none; }
  table { display: block; }
  thead { display: none; }
  tbody { display: block; }
  tr { display: block; padding: var(--space-sm) var(--space-md); border-bottom: var(--rule-hair) solid var(--color-rule); }
  td { display: block; white-space: normal; padding: var(--space-2xs) 0; border-bottom: 0; }
  td.num { text-align: left; }
  td .row { justify-content: flex-start !important; flex-wrap: wrap; }
  .filters { grid-template-columns: 1fr; }
  .page-head .actions { width: 100%; }
  .reading { font-size: var(--text-2xl); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  .wire-body .fresh .arrow { stroke-dashoffset: 0; }
  .wire-body .fresh text, .wire-body .fresh .head { opacity: 1; }
}
</style>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="2.2"/><circle cx="19" cy="5.5" r="2.2"/><circle cx="19" cy="18.5" r="2.2"/><path d="M7 11l10-4.4M7 13l10 4.4"/></svg>
      <span>Crosstalk</span>
    </div>
    <nav class="nav" id="nav" aria-label="Main">
      <a href="#/overview" data-page="overview"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg><span class="label">Overview</span></a>
      <a href="#/live" data-page="live"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 2v12M13 2v12"/><path d="M3 5.5h8.5M11 4l1.7 1.5L11 7"/><path d="M13 10.5H4.5M5 9l-1.7 1.5L5 12"/></svg><span class="label">Live</span></a>
      <a href="#/sessions" data-page="sessions"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="3" width="12" height="9" rx="1.5"/><path d="M5 14h6M5.5 6.5l1.5 1.5-1.5 1.5M8.5 9.5h2"/></svg><span class="label">Sessions</span></a>
      <a href="#/messages" data-page="messages"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 3.5h11v7h-6L4 13v-2.5H2.5z"/></svg><span class="label">Messages</span><span class="count" id="cnt-messages" hidden></span></a>
      <a href="#/approvals" data-page="approvals"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 1.8l5 1.9v4c0 3-2.1 5-5 6.5-2.9-1.5-5-3.5-5-6.5v-4z"/><path d="M5.8 8l1.6 1.6L10.4 6.6"/></svg><span class="label">Approvals</span><span class="count" id="cnt-approvals" hidden></span></a>
      <a href="#/history" data-page="history"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2L14 14"/></svg><span class="label">History</span></a>
      <a href="#/teams" data-page="teams"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="6" cy="5.5" r="2.3"/><path d="M1.8 13c.2-2.4 1.9-3.8 4.2-3.8s4 1.4 4.2 3.8"/><circle cx="11.6" cy="6.3" r="1.8"/><path d="M11.4 9.4c1.7.1 2.9 1.2 3.1 3"/></svg><span class="label">Teams</span></a>
      <a href="#/setup" data-page="setup"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.7M8 12.5v1.7M1.8 8h1.7M12.5 8h1.7M3.6 3.6l1.2 1.2M11.2 11.2l1.2 1.2M12.4 3.6l-1.2 1.2M4.8 11.2l-1.2 1.2"/></svg><span class="label">Setup</span><span class="count" id="cnt-setup" hidden></span></a>
    </nav>
    <div class="side-foot">
      <div class="conn"><span class="dot" id="conn-dot"></span><span id="conn-text">Connecting…</span></div>
      <div class="faint small mono trunc" id="conn-id" style="margin-top:4px"></div>
    </div>
  </aside>
  <main class="main" id="main" tabindex="-1">
    <div class="page" id="view" aria-live="off"></div>
  </main>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<dialog id="dlg" aria-labelledby="dlg-title"><form method="dialog" class="dlg" id="dlg-form"><h2 id="dlg-title"></h2><div id="dlg-body"></div><div class="dlg-foot"><button class="btn" value="cancel" id="dlg-cancel">Cancel</button><button class="btn primary" value="ok" id="dlg-ok">OK</button></div></form></dialog>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const view = $("#view");
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = (s, n = 8) => (s ? String(s).slice(0, n) : "");
const state = { overview: null, error: null, sessions: new Map(), page: "overview", lastRender: {}, thread: null, qTab: "pending", timers: [] };

async function api(name, params) {
  const init = params === undefined ? { method: "GET" } : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(params) };
  const res = await fetch("/api/" + name, init);
  if (res.status === 403) throw new Error("The dashboard refused this request (not from this page).");
  const body = await res.json();
  if (body.ok === false) throw new Error(body.error ? body.error.message || body.error.code : "request failed");
  return body.result;
}
function toast(text, bad = false) {
  const el = document.createElement("div");
  el.className = "toast" + (bad ? " bad" : "");
  el.textContent = text;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), bad ? 7000 : 3800);
}
const rel = (ts) => {
  if (!ts) return "never";
  const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));
  if (s < 10) return "just now";
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
};
const clock = (ts) => new Date(ts * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
const providerOf = (s) => (s.provider || (s.agent_type || "").replace("-code", "") || "agent");
const providerName = (p) => ({ claude: "Claude Code", codex: "Codex", cursor: "Cursor", kiro: "Kiro", opencode: "OpenCode" }[p] || p || "Agent");
function initials(key) {
  if (key === "human") return "You";
  const s = state.sessions.get(key);
  const p = s ? providerOf(s) : "";
  return p === "claude" ? "CC" : p === "codex" ? "CX" : p === "cursor" ? "CU" : p === "kiro" ? "KI" : p === "opencode" ? "OC" : (key || "?").slice(0, 2).toUpperCase();
}
function avatarClass(key) { if (key === "human") return "human"; const s = state.sessions.get(key); return s ? providerOf(s) : ""; }
function nameOf(key) { if (key === "human") return "You (human)"; const s = state.sessions.get(key); return s ? s.name : key; }
function pill(kind, label) { return `<span class="pill ${esc(kind)}">${esc(label || kind)}</span>`; }
function tag(p) { return `<span class="tag ${esc(p)}">${esc(providerName(p))}</span>`; }
function copyBtn(text, label = "Copy") { return `<button class="btn sm" data-copy="${esc(text)}">${label}</button>`; }
function empty(title, text) { return `<div class="empty"><strong>${esc(title)}</strong>${text ? `<p>${text}</p>` : ""}</div>`; }
function loading(n = 3) { return `<div class="panel"><div class="body stack">${Array.from({ length: n }, () => '<div class="skeleton"></div>').join("")}</div></div>`; }
function errorBox(text) { return `<div class="error-box" role="alert">${esc(text)}</div>`; }
function highlight(text, q) {
  const safe = esc(text);
  if (!q) return safe;
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/&/g, "&amp;"), "gi");
  return safe.replace(re, (m) => `<mark>${m}</mark>`);
}
function setHTML(el, html, key) {
  // Avoid re-rendering identical content: keeps focus, selection and scroll.
  if (state.lastRender[key] === html) return false;
  state.lastRender[key] = html;
  el.innerHTML = html;
  return true;
}
function confirmDialog({ title, body, ok = "Confirm", danger = false }) {
  return new Promise((resolve) => {
    const dlg = $("#dlg");
    $("#dlg-title").textContent = title;
    $("#dlg-body").innerHTML = body;
    const okBtn = $("#dlg-ok");
    okBtn.textContent = ok;
    okBtn.className = "btn " + (danger ? "danger solid" : "primary");
    dlg.addEventListener("close", () => resolve(dlg.returnValue === "ok"), { once: true });
    dlg.returnValue = "cancel";
    dlg.showModal();
    $("#dlg-cancel").focus();
  });
}
document.addEventListener("click", async (e) => {
  const c = e.target.closest("[data-copy]");
  if (c) {
    try { await navigator.clipboard.writeText(c.dataset.copy); toast("Copied to clipboard"); }
    catch { toast("Copy failed — select the text and copy it manually", true); }
  }
});

/* ---------- data ---------- */
async function refreshOverview() {
  try {
    const o = await api("overview");
    state.overview = o;
    state.error = null;
    state.sessions = new Map((o.sessions || []).map((s) => [s.session_key, s]));
  } catch (err) {
    state.error = err.message;
  }
  paintChrome();
}
function paintChrome() {
  const o = state.overview;
  const dot = $("#conn-dot"), text = $("#conn-text");
  if (state.error && !o) { dot.className = "dot bad"; text.textContent = "Daemon unreachable"; }
  else if (state.error) { dot.className = "dot warn"; text.textContent = "Reconnecting…"; }
  else if (o) {
    const peers = (o.peers || []).filter((p) => p.connected).length;
    dot.className = "dot ok";
    text.textContent = "Daemon running" + (peers ? ` · ${peers} peer${peers === 1 ? "" : "s"}` : "");
    $("#conn-id").textContent = o.network && o.network.peer_id ? "machine " + short(o.network.peer_id, 12) : "";
  }
  const pending = o ? (o.questions || []).length : 0;
  const a = $("#cnt-approvals");
  a.hidden = pending === 0; a.textContent = pending; a.classList.toggle("alert", pending > 0);
  document.title = (pending ? `(${pending}) ` : "") + "Crosstalk";
  const setup = $("#cnt-setup");
  const needsSetup = o && (o.sessions || []).length === 0;
  setup.hidden = !needsSetup; setup.textContent = "!";
}

/* ---------- pages ---------- */
const pages = {};
function route() {
  const name = (location.hash.replace(/^#\/?/, "").split("/")[0]) || "overview";
  const page = pages[name] ? name : "overview";
  state.page = page;
  document.querySelectorAll("#nav a").forEach((a) => a.toggleAttribute("aria-current", a.dataset.page === page) || (a.dataset.page !== page && a.removeAttribute("aria-current")));
  document.querySelectorAll("#nav a").forEach((a) => { if (a.dataset.page === page) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  state.lastRender = {};
  view.innerHTML = loading();
  pages[page].mount();
  $("#main").focus({ preventScroll: true });
}
function head(title, desc, actions = "") {
  return `<div class="page-head"><div><h1>${esc(title)}</h1>${desc ? `<p>${desc}</p>` : ""}</div><div class="actions">${actions}</div></div>`;
}
function sessionIdentity(s) {
  const p = providerOf(s);
  const proj = s.repo || (s.working_dir ? s.working_dir.split(/[\\/]/).filter(Boolean).pop() : "");
  return `<div class="row"><span class="avatar ${esc(p)}">${esc(initials(s.session_key))}</span><div style="min-width:0"><div class="trunc"><strong>${esc(s.name)}</strong></div><div class="small muted trunc">${esc(providerName(p))}${proj ? " · " + esc(proj) : ""}${s.branch ? " · " + esc(s.branch) : ""}</div></div></div>`;
}
function machineLabel(s) {
  const me = state.overview && state.overview.network && state.overview.network.peer_id;
  if (s.local || s.machine === me) return `<span>This machine</span>`;
  return `<span class="mono" title="${esc(s.machine)}">${esc(short(s.machine, 10))}</span> ${s.reachable ? pill("connected", "reachable") : pill("offline", "unreachable")}`;
}

/* Overview */
pages.overview = {
  mount() { this.paint(); },
  paint() {
    if (state.page !== "overview") return;
    const o = state.overview;
    if (!o) { if (state.error) view.innerHTML = head("Overview") + errorBox("Cannot reach the daemon: " + state.error); return; }
    const sessions = o.sessions || [];
    const live = sessions.filter((s) => s.liveness === "active" || s.liveness === "idle");
    const stale = sessions.filter((s) => s.liveness === "stale");
    const peers = o.peers || [];
    const offlinePeers = peers.filter((p) => !p.connected && p.status !== "left");
    const pend = (o.questions || []);
    const notes = [];
    if (pend.length) notes.push(`<div class="notice warn"><strong>${pend.length} approval${pend.length === 1 ? "" : "s"} waiting</strong><span class="muted">${esc(pend.slice(0, 2).map((q) => nameOf(q.session_key)).join(", "))} ${pend.length === 1 ? "is" : "are"} blocked on you.</span><span class="spacer"></span><a class="btn sm primary" href="#/approvals">Review</a></div>`);
    if (!sessions.length) notes.push(`<div class="notice"><strong>No agent sessions yet</strong><span class="muted">Connect Claude Code or Codex to start collaborating.</span><span class="spacer"></span><a class="btn sm primary" href="#/setup">Open setup</a></div>`);
    if (stale.length) notes.push(`<div class="notice"><strong>${stale.length} stale session${stale.length === 1 ? "" : "s"}</strong><span class="muted">Registered but not seen for hours.</span><span class="spacer"></span><a class="btn sm" href="#/sessions">Manage</a></div>`);
    if (offlinePeers.length) notes.push(`<div class="notice"><strong>${offlinePeers.length} teammate machine${offlinePeers.length === 1 ? "" : "s"} offline</strong><span class="muted">Messages to them are queued and retried.</span></div>`);
    if ((o.overlaps || []).length) notes.push(`<div class="notice warn"><strong>File overlap</strong><span class="muted">${esc(o.overlaps.map((x) => x.path).slice(0, 2).join(", "))} edited by more than one session.</span></div>`);
    if (!notes.length) notes.push(`<div class="notice ok"><strong>All clear</strong><span class="muted">Nothing needs your attention.</span></div>`);

    const rows = (live.length ? live : sessions).slice(0, 8).map((s) => `<tr><td>${sessionIdentity(s)}</td><td class="hide-sm">${machineLabel(s)}</td><td>${pill(s.liveness)}</td><td class="hide-sm muted trunc" style="max-width:220px">${esc(s.activity || "—")}</td><td class="muted num">${rel(s.last_seen)}</td></tr>`).join("");
    const sessionsPanel = `<section class="panel"><header><h2>Agent sessions</h2><a href="#/sessions" class="small">All ${sessions.length} sessions</a></header>${sessions.length ? `<div class="table-wrap"><table><thead><tr><th>Session</th><th class="hide-sm">Machine</th><th>Status</th><th class="hide-sm">Activity</th><th class="num">Seen</th></tr></thead><tbody>${rows}</tbody></table></div>` : empty("No sessions registered", "Sessions appear when Claude Code or Codex start in a configured project.")}</section>`;

    const convs = (state.convs || []).slice(0, 6);
    const convPanel = `<section class="panel"><header><h2>Recent conversations</h2><a href="#/messages" class="small">Open messages</a></header>${convs.length ? `<ul class="list">${convs.map((c) => `<li><a class="list-btn" style="text-decoration:none;color:inherit" href="#/messages/${encodeURIComponent(c.a)}/${encodeURIComponent(c.b)}"><span class="avatar ${esc(avatarClass(c.last_sender))}">${esc(initials(c.last_sender))}</span><span style="min-width:0;flex:1"><div class="trunc"><strong>${esc(nameOf(c.a))}</strong> <span class="faint">↔</span> <strong>${esc(nameOf(c.b))}</strong></div><div class="small muted trunc">${esc(c.last_body)}</div></span><span class="small faint">${rel(c.last_at)}</span></a></li>`).join("")}</ul>` : empty("No conversations yet", "Messages between sessions will show up here.")}</section>`;

    const me = o.network && o.network.peer_id;
    const machines = `<section class="panel"><header><h2>Machines &amp; teams</h2><a href="#/teams" class="small">Manage</a></header><div class="body stack" style="gap:10px">
      <div class="row"><span class="dot ok"></span><strong>This machine</strong><span class="spacer"></span><span class="mono faint">${esc(short(me, 12))}</span></div>
      ${peers.map((p) => `<div class="row"><span class="dot ${p.connected ? "ok" : "warn"}"></span><span class="trunc">${esc(p.label || "Peer " + short(p.peer_id, 10))}</span><span class="spacer"></span>${pill(p.status)}</div>`).join("")}
      ${(o.teams || []).length ? `<hr style="border:0;border-top:1px solid var(--border);width:100%;margin:2px 0">` + o.teams.map((t) => `<div class="row"><strong class="trunc">${esc(t.name)}</strong><span class="tag ${t.is_admin ? "admin" : ""}">${t.is_admin ? "Admin" : "Member"}</span><span class="spacer"></span><span class="muted small">${t.members} member${t.members === 1 ? "" : "s"}</span></div>`).join("") : `<p class="muted small">Not in a team yet. <a href="#/teams">Create or join one</a>.</p>`}
    </div></section>`;

    const outbox = o.outbox || [];
    const counts = { pending: 0, sent: 0, acked: 0 };
    outbox.forEach((m) => { if (counts[m.delivery_state] !== undefined) counts[m.delivery_state]++; });
    const delivery = `<section class="panel"><header><h2>Message delivery</h2><span class="small muted">last ${outbox.length} to other machines</span></header><div class="body">${outbox.length ? `<div class="row wrap" style="gap:18px"><div><div style="font-size:22px;font-weight:600">${counts.acked}</div><div class="small muted">delivered</div></div><div><div style="font-size:22px;font-weight:600">${counts.sent}</div><div class="small muted">sent, awaiting ack</div></div><div><div style="font-size:22px;font-weight:600;color:${counts.pending ? "var(--warn)" : "inherit"}">${counts.pending}</div><div class="small muted">queued for offline peers</div></div></div>` : `<p class="muted small">No messages have gone to other machines yet. Messages between sessions on this machine are delivered instantly.</p>`}</div></section>`;

    const anchor = o.anchor || {};
    const anchorPanel = `<section class="panel"><header><h2>Anchor</h2>${pill(anchor.anchor ? "active" : "offline", anchor.anchor ? "On" : "Off")}</header><div class="body stack" style="gap:10px"><p class="small muted">${esc(anchor.note || "")}</p><div class="row"><span class="small muted">${anchor.messages_retained ?? 0} messages retained</span><span class="spacer"></span><button class="btn sm" id="anchor-toggle">${anchor.anchor ? "Turn off" : "Make this machine the anchor"}</button></div></div></section>`;

    const convAll = state.convs || [];
    const msgTotal = convAll.reduce((n, c) => n + (c.total || 0), 0);
    const readings = `<div class="readings" role="region" aria-label="Readings">
      <div class="reading-cell"><div class="label">Agents live</div><span class="reading">${live.length}</span><div class="note">${sessions.length} registered</div></div>
      <div class="reading-cell"><div class="label">Conversations</div><span class="reading">${convAll.length}</span><div class="note">between sessions and you</div></div>
      <div class="reading-cell"><div class="label">Messages carried</div><span class="reading">${msgTotal}</span><div class="note">none of them pasted by hand</div></div>
      <div class="reading-cell${pend.length ? " person" : ""}"><div class="label">Waiting on you</div><span class="reading">${pend.length}</span><div class="note">${pend.length ? `<a href="#/approvals">Review approvals</a>` : "nothing to decide"}</div></div>
    </div>`;
    const html = head("Overview", "The state of your agent network right now.", `<a class="btn" href="#/live">Watch the wire</a><button class="btn" id="refresh">Refresh</button>`) +
      readings +
      `<div class="attention" role="region" aria-label="Needs attention">${notes.join("")}</div>` +
      `<div class="grid two"><div class="stack">${sessionsPanel}${convPanel}</div><div class="stack">${machines}${delivery}${anchorPanel}</div></div>`;
    if (setHTML(view, html, "overview")) {
      $("#refresh").onclick = async () => { await refreshOverview(); await pages.messages.loadConvs(); pages.overview.paint(); };
      $("#anchor-toggle").onclick = async () => {
        try { await api("set-anchor", { enabled: !anchor.anchor }); toast(anchor.anchor ? "Anchor role turned off" : "This machine is now the anchor"); await refreshOverview(); } catch (e) { toast(e.message, true); }
      };
    }
  },
};

/* Sessions */
pages.sessions = {
  filter: "all", q: "",
  mount() { this.paint(); },
  paint() {
    if (state.page !== "sessions") return;
    const o = state.overview;
    if (!o) { view.innerHTML = head("Sessions") + (state.error ? errorBox(state.error) : loading()); return; }
    const all = o.sessions || [];
    const counts = { all: all.length };
    ["active", "idle", "offline", "stale"].forEach((k) => (counts[k] = all.filter((s) => s.liveness === k).length));
    const q = this.q.trim().toLowerCase();
    const list = all.filter((s) => (this.filter === "all" || s.liveness === this.filter) && (!q || [s.name, s.session_key, s.repo, s.working_dir, s.agent_type].join(" ").toLowerCase().includes(q)));
    const order = { active: 0, idle: 1, stale: 2, offline: 3 };
    list.sort((a, b) => (order[a.liveness] ?? 9) - (order[b.liveness] ?? 9) || b.last_seen - a.last_seen);
    const rows = list.map((s) => {
      const key = esc(s.session_key);
      const forget = s.local
        ? `<button class="btn sm danger" data-forget="${key}">Forget…</button>`
        : `<button class="btn sm" disabled title="Owned by another machine; only its owner can forget it">Forget…</button>`;
      return `<tr><td>${sessionIdentity(s)}<div class="small faint mono trunc" style="max-width:340px;margin-top:2px" title="${key}">${key}</div></td>
        <td class="hide-sm"><div class="small trunc" style="max-width:240px" title="${esc(s.working_dir || "")}">${esc(s.working_dir || s.repo || "—")}</div></td>
        <td>${machineLabel(s)}</td><td>${pill(s.liveness)}<div class="small faint">${esc(s.status)}</div></td>
        <td class="muted num">${rel(s.last_seen)}</td>
        <td><div class="row" style="justify-content:flex-end"><a class="btn sm" href="#/messages/${encodeURIComponent("human")}/${encodeURIComponent(s.session_key)}">Conversation</a>${forget}</div></td></tr>`;
    }).join("");
    const html = head("Sessions", "Every Claude Code and Codex session registered on this machine or by a teammate. A registration is only a record: forgetting one never stops the agent itself.") +
      `<div class="row wrap" style="margin-bottom:12px"><div class="seg" role="group" aria-label="Filter by status">${["all", "active", "idle", "offline", "stale"].map((k) => `<button data-f="${k}" aria-pressed="${this.filter === k}">${k[0].toUpperCase() + k.slice(1)} ${counts[k]}</button>`).join("")}</div><span class="spacer"></span><label class="sr-only" for="sq">Search sessions</label><input type="search" id="sq" placeholder="Search by name, project or key" value="${esc(this.q)}" style="max-width:300px"></div>` +
      `<section class="panel">${rows ? `<div class="table-wrap"><table><thead><tr><th>Session</th><th class="hide-sm">Working directory</th><th>Machine</th><th>Status</th><th class="num">Last seen</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>${rows}</tbody></table></div>` : empty(all.length ? "No sessions match" : "No sessions registered yet", all.length ? "Try another filter." : 'Open Claude Code or Codex in a configured project, or follow <a href="#/setup">Setup</a>.')}</section>
      <p class="small muted" style="margin-top:12px">Status is derived from heartbeats: <strong>active</strong> seen in the last couple of minutes or working, <strong>idle</strong> registered but quiet, <strong>stale</strong> silent for hours, <strong>offline</strong> the agent reported its session ended.</p>`;
    const focus = document.activeElement && document.activeElement.id === "sq";
    if (setHTML(view, html, "sessions")) {
      view.querySelectorAll("[data-f]").forEach((b) => (b.onclick = () => { this.filter = b.dataset.f; state.lastRender.sessions = null; this.paint(); }));
      const sq = $("#sq");
      sq.oninput = () => { this.q = sq.value; state.lastRender.sessions = null; this.paint(); const n = $("#sq"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
      view.querySelectorAll("[data-forget]").forEach((b) => (b.onclick = () => this.forget(b.dataset.forget)));
      if (focus) { sq.focus(); sq.setSelectionRange(sq.value.length, sq.value.length); }
    }
  },
  async forget(key) {
    const s = state.sessions.get(key);
    const ok = await confirmDialog({
      title: `Forget “${s ? s.name : key}”?`, ok: "Forget registration", danger: true,
      body: `<p>This removes the registration from Crosstalk on this machine. Conversation history is kept.</p>
        <p style="margin-top:8px"><strong>It does not stop or close the agent.</strong> If ${s ? esc(providerName(providerOf(s))) : "the agent"} is still running, it will register again the next time it is active.</p>
        ${s && (s.liveness === "active") ? `<p class="notice warn" style="margin-top:10px">This session looks <strong>active</strong> right now.</p>` : ""}`,
    });
    if (!ok) return;
    try { await api("forget-session", { session_key: key }); toast("Registration forgotten (the agent was not touched)"); await refreshOverview(); this.paint(); } catch (e) { toast(e.message, true); }
  },
};

/* Messages */
pages.messages = {
  convs: [], q: "", unreadOnly: false, pair: null, msgs: [], loadedKey: "",
  mount() {
    const parts = location.hash.replace(/^#\/?/, "").split("/");
    this.pair = parts[1] && parts[2] ? [decodeURIComponent(parts[1]), decodeURIComponent(parts[2])] : null;
    this.msgs = []; this.loadedKey = "";
    this.loadConvs().then(() => this.paint());
    if (this.pair) this.loadThread();
  },
  async loadConvs() {
    try { const r = await api("all-conversations"); this.convs = r.conversations || []; state.convs = this.convs; } catch { /* keep previous */ }
  },
  async loadThread() {
    if (!this.pair) return;
    try {
      const r = await api("conversation", { session_key: this.pair[0], with: this.pair[1], limit: 500 });
      this.msgs = r.messages || [];
    } catch (e) { toast(e.message, true); }
    this.paintThread();
  },
  paint() {
    if (state.page !== "messages") return;
    const q = this.q.trim().toLowerCase();
    const list = this.convs.filter((c) => (!this.unreadOnly || c.unread > 0) && (!q || [nameOf(c.a), nameOf(c.b), c.last_body].join(" ").toLowerCase().includes(q)));
    const items = list.map((c) => {
      const other = c.a === "human" ? c.b : c.a;
      const sel = this.pair && ((this.pair[0] === c.a && this.pair[1] === c.b) || (this.pair[0] === c.b && this.pair[1] === c.a));
      return `<li><a class="list-btn" style="text-decoration:none;color:inherit" href="#/messages/${encodeURIComponent(c.a)}/${encodeURIComponent(c.b)}" ${sel ? 'aria-current="true"' : ""}>
        <span class="avatar ${esc(avatarClass(other))}">${esc(initials(other))}</span>
        <span style="min-width:0;flex:1"><div class="row"><strong class="trunc" style="flex:1">${esc(c.a === "human" || c.b === "human" ? nameOf(other) : nameOf(c.a) + " ↔ " + nameOf(c.b))}</strong><span class="small faint">${rel(c.last_at)}</span></div>
        <div class="small muted trunc">${c.last_sender === "human" ? "You: " : ""}${esc(c.last_body)}</div></span>
        ${c.unread ? `<span class="unread-dot" title="${c.unread} unread by the recipient"></span><span class="sr-only">${c.unread} unread</span>` : ""}</a></li>`;
    }).join("");
    const html = head("Messages", "Conversations between agent sessions, and between you and them.") +
      `<div class="mail"><section class="panel" aria-label="Conversations"><div class="tools"><label class="sr-only" for="cq">Search conversations</label><input type="search" id="cq" placeholder="Search conversations" value="${esc(this.q)}"><label class="row small muted"><input type="checkbox" id="cu" ${this.unreadOnly ? "checked" : ""}> Unread only</label></div><div class="scroll">${items ? `<ul class="list">${items}</ul>` : empty(this.convs.length ? "No matches" : "No conversations yet", this.convs.length ? "" : "Once agents message each other, their threads appear here. You can also start one from a session.")}</div></section>
      <section class="panel" id="thread" aria-label="Conversation"></section></div>`;
    if (setHTML(view, html, "messages")) {
      const cq = $("#cq");
      cq.oninput = () => { this.q = cq.value; state.lastRender.messages = null; this.paint(); const n = $("#cq"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
      $("#cu").onchange = (e) => { this.unreadOnly = e.target.checked; state.lastRender.messages = null; this.paint(); };
      state.lastRender.thread = null;
    }
    this.paintThread();
  },
  paintThread() {
    const el = $("#thread");
    if (!el) return;
    if (!this.pair) { el.innerHTML = empty("Select a conversation", "Choose one on the left to read it and reply."); return; }
    const [a, b] = this.pair;
    const targets = [a, b].filter((k) => k !== "human" && state.sessions.get(k) && state.sessions.get(k).local);
    const byId = new Map(this.msgs.map((m) => [m.id, m]));
    const head = `<div class="thread-head"><span class="avatar ${esc(avatarClass(b === "human" ? a : b))}">${esc(initials(b === "human" ? a : b))}</span><div style="min-width:0"><strong>${esc(a === "human" || b === "human" ? nameOf(a === "human" ? b : a) : nameOf(a) + " ↔ " + nameOf(b))}</strong><div class="small muted trunc">${[a, b].filter((k) => k !== "human").map((k) => { const s = state.sessions.get(k); return s ? esc(providerName(providerOf(s))) + " · " + esc(s.liveness) : esc(k) + " (unknown session)"; }).join(" · ")}</div></div></div>`;
    const body = this.msgs.length ? this.msgs.map((m) => {
      const human = m.sender_key === "human";
      const reply = m.reply_to ? (byId.get(m.reply_to) ? `<div class="replyto">↳ replying to ${esc(nameOf(byId.get(m.reply_to).sender_key))}: ${esc(byId.get(m.reply_to).body.slice(0, 120))}</div>` : `<div class="replyto">↳ reply to ${m.reply_to.startsWith("q-") ? "an approval question" : "an earlier message"}</div>`) : "";
      const p = human ? "human" : avatarClass(m.sender_key);
      return `<div class="msg ${human ? "human" : ""}"><div class="meta"><span class="who">${esc(nameOf(m.sender_key))}</span>${human ? '<span class="tag human">Human</span>' : tag(p || "agent")}<span class="faint" title="${esc(new Date(m.created_at * 1000).toLocaleString())}">${clock(m.created_at)}</span></div>${reply}<div class="bubble">${esc(m.body)}</div><div class="state">${esc({ queued: "Queued — recipient machine offline", sent: "Sent to the other machine", delivered: "Delivered, not read yet", read: "Read by " + nameOf(m.recipient_key) }[m.delivery] || m.delivery)}${m.delivery === "read" ? "" : " · to " + esc(nameOf(m.recipient_key))}</div></div>`;
    }).join("") : empty("No messages yet", "Write the first one below.");
    const composer = targets.length
      ? `<form class="composer" id="composer"><div class="row"><label for="ct" class="small muted">Send as you to</label><select id="ct" style="max-width:260px">${targets.map((t) => `<option value="${esc(t)}">${esc(nameOf(t))}</option>`).join("")}</select></div><label class="sr-only" for="cb">Message</label><textarea id="cb" placeholder="Write a message. The agent sees it as coming from the human operator." required></textarea><div class="row"><span class="small muted">Delivered to the agent at its next prompt, tool call or turn end.</span><span class="spacer"></span><button class="btn primary" type="submit">Send</button></div></form>`
      : `<div class="composer"><p class="small muted">${a !== "human" && b !== "human" ? "This is a conversation between two agents." : ""} You can message sessions that run on this machine. This session is not available here.</p></div>`;
    const key = JSON.stringify([this.msgs.map((m) => m.id + m.delivery), a, b]) + targets.join();
    if (state.lastRender.thread === key) return;
    const old = $("#cb") ? $("#cb").value : "";
    const oldTarget = $("#ct") ? $("#ct").value : "";
    const scroller = $("#thread .scroll");
    const atBottom = !scroller || scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 60;
    state.lastRender.thread = key;
    el.style.display = "flex"; el.style.flexDirection = "column"; el.style.overflow = "hidden";
    el.innerHTML = head + `<div class="scroll"><div class="msgs">${body}</div></div>` + composer;
    const sc = $("#thread .scroll");
    if (atBottom || !scroller) sc.scrollTop = sc.scrollHeight; else sc.scrollTop = scroller.scrollTop;
    if ($("#cb")) { $("#cb").value = old; if (oldTarget) $("#ct").value = oldTarget; }
    const form = $("#composer");
    if (form) form.onsubmit = async (e) => {
      e.preventDefault();
      const text = $("#cb").value.trim();
      if (!text) return;
      try { await api("send-human", { recipient_key: $("#ct").value, body: text }); $("#cb").value = ""; toast("Message sent"); await this.loadConvs(); this.paint(); await this.loadThread(); }
      catch (err) { toast(err.message, true); }
    };
  },
  tick() { if (state.page !== "messages") return; this.loadConvs().then(() => { this.paint(); }); if (this.pair) this.loadThread(); },
};
window.addEventListener("hashchange", () => { state.thread = null; });

/* Approvals */
pages.approvals = {
  pending: [], answered: [], open: new Set(),
  mount() { this.load(); },
  async load() {
    try {
      this.pending = (await api("questions", { status: "pending" })).questions || [];
      this.answered = ((await api("questions", { status: "answered" })).questions || []).sort((a, b) => b.answered_at - a.answered_at);
    } catch (e) { view.innerHTML = head("Approvals") + errorBox(e.message); return; }
    this.paint();
  },
  paint() {
    if (state.page !== "approvals") return;
    const tab = state.qTab;
    const card = (q, pending) => {
      const s = q.session || {};
      const p = (s.agent_type || "").replace("-code", "");
      const ctx = (q.context || []).map((m) => `<li><span class="muted">${esc(nameOf(m.sender_key))} → ${esc(nameOf(m.recipient_key))}</span><br>${esc(m.body)}</li>`).join("");
      const others = [...state.sessions.values()].filter((x) => x.local && x.session_key !== q.session_key && (x.liveness === "active" || x.liveness === "idle"));
      return `<article class="approval ${pending ? "pending" : ""}" data-q="${esc(q.id)}">
        <div class="row wrap"><span class="avatar ${esc(p)}">${esc(initials(q.session_key))}</span><div><strong>${esc(s.name || q.session_key)}</strong> <span class="muted small">${s.agent_type ? tag(p) : ""} ${s.repo ? "· " + esc(s.repo) : ""}</span><div class="small muted">Asked ${rel(q.created_at)}${pending ? "" : " · answered " + rel(q.answered_at)}</div></div></div>
        <div class="q">${esc(q.question)}</div>
        ${ctx ? `<details class="ctx"><summary>Recent context (${q.context.length})</summary><ul>${ctx}</ul></details>` : ""}
        ${pending ? `<div class="decision"><button class="btn primary" data-act="approve">Approve</button><button class="btn danger" data-act="reject">Reject</button><button class="btn" data-act="custom-toggle" aria-expanded="${this.open.has(q.id)}">Custom response…</button></div>
          <div class="custom" ${this.open.has(q.id) ? "" : "hidden"}><label class="sr-only" for="c-${esc(q.id)}">Custom response</label><textarea id="c-${esc(q.id)}" placeholder="Tell the agent what to do instead"></textarea>
          ${others.length ? `<label class="row small"><input type="checkbox" data-share> Also tell <select data-share-to style="width:auto;max-width:240px">${others.map((x) => `<option value="${esc(x.session_key)}">${esc(x.name)}</option>`).join("")}</select> about the decision</label>` : ""}
          <div><button class="btn primary" data-act="custom-send">Send response</button></div></div>`
          : `<div class="row wrap"><span class="tag ${/^approved/i.test(q.answer || "") ? "admin" : ""}">Decision</span><strong>${esc(q.answer)}</strong><span class="spacer"></span>${q.delivery ? pill(q.delivery.startsWith("read") ? "read" : "pending", q.delivery) : ""}</div>`}
      </article>`;
    };
    const list = tab === "pending" ? this.pending : this.answered;
    const html = head("Approvals", "Questions agents ask you. Only your answer here counts as a human decision — a message from another agent can never approve anything.") +
      `<div class="row" style="margin-bottom:12px"><div class="seg" role="tablist" aria-label="Approval state"><button role="tab" aria-selected="${tab === "pending"}" data-tab="pending">Pending ${this.pending.length}</button><button role="tab" aria-selected="${tab === "answered"}" data-tab="answered">Answered ${this.answered.length}</button></div></div>` +
      `<section class="panel">${list.length ? list.map((q) => card(q, tab === "pending")).join("") : empty(tab === "pending" ? "Nothing waiting for you" : "No answered questions yet", tab === "pending" ? "When an agent calls <code>ask_user</code>, its question appears here." : "")}</section>`;
    // Keep what the user is typing while polling.
    const typing = document.activeElement && document.activeElement.tagName === "TEXTAREA" && view.contains(document.activeElement);
    if (typing) return;
    if (setHTML(view, html, "approvals")) {
      view.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => { state.qTab = b.dataset.tab; state.lastRender.approvals = null; this.paint(); }));
      view.querySelectorAll("article[data-q]").forEach((a) => {
        const id = a.dataset.q;
        a.querySelectorAll("[data-act]").forEach((b) => (b.onclick = () => {
          const act = b.dataset.act;
          if (act === "approve") this.answer(id, "Approved");
          else if (act === "reject") this.answer(id, "Rejected");
          else if (act === "custom-toggle") { const c = a.querySelector(".custom"); c.hidden = !c.hidden; b.setAttribute("aria-expanded", String(!c.hidden)); if (!c.hidden) { this.open.add(id); c.querySelector("textarea").focus(); } else this.open.delete(id); }
          else if (act === "custom-send") { const t = a.querySelector("textarea").value.trim(); if (!t) { toast("Write a response first", true); return; } this.answer(id, t, a); }
        }));
      });
    }
  },
  async answer(id, text, article) {
    const q = this.pending.find((x) => x.id === id);
    try {
      await api("answer", { question_id: id, answer: text });
      const share = article && article.querySelector("[data-share]");
      if (share && share.checked) {
        const to = article.querySelector("[data-share-to]").value;
        const who = nameOf(q.session_key);
        await api("send-human", { recipient_key: to, body: `Human decision on a question from ${who} ("${q.question.slice(0, 160)}"): ${text}` });
      }
      toast("Answer sent to " + nameOf(q.session_key));
      this.open.delete(id);
      await refreshOverview(); await this.load();
    } catch (e) { toast(e.message, true); }
  },
  tick() { if (state.page === "approvals") this.load(); },
};

/* History */
pages.history = {
  res: null, last: null,
  mount() {
    const sessions = [...state.sessions.values()];
    const html = head("History", "Search every message stored on this machine.") +
      `<form class="panel" id="hf"><div class="body filters">
        <label class="field">Message contains<input type="search" id="hq" placeholder="e.g. migration plan" autocomplete="off"></label>
        <label class="field">Session<select id="hs"><option value="">Any session</option>${sessions.map((s) => `<option value="${esc(s.session_key)}">${esc(s.name)}</option>`).join("")}</select></label>
        <label class="field">From<select id="hw"><option value="">Anyone</option><option value="human">You (human)</option><option value="agent">Agents</option></select></label>
        <label class="field">When<select id="ht"><option value="0">All time</option><option value="86400">Last 24 hours</option><option value="604800">Last 7 days</option><option value="2592000">Last 30 days</option></select></label>
        <button class="btn primary" type="submit">Search</button></div></form>
      <div id="hres" style="margin-top:16px"></div>`;
    view.innerHTML = html;
    $("#hf").onsubmit = (e) => { e.preventDefault(); this.run(); };
    $("#hres").innerHTML = `<section class="panel">${empty("Search your message history", "Results show the messages around each match, and who sent them.")}</section>`;
    $("#hq").focus();
  },
  async run() {
    const q = $("#hq").value.trim();
    if (!q) { toast("Enter some text to search for", true); return; }
    const since = Number($("#ht").value);
    $("#hres").innerHTML = loading(4);
    try {
      const r = await api("search", { query: q, session_key: $("#hs").value || null, sender: $("#hw").value || null, since: since ? Math.floor(Date.now() / 1000) - since : null, context: true, limit: 100 });
      const hits = r.messages || [];
      $("#hres").innerHTML = `<p class="small muted" style="margin-bottom:8px" role="status">${hits.length} result${hits.length === 1 ? "" : "s"} for “${esc(q)}”</p><section class="panel">${hits.length ? hits.map((m) => `<div class="hit">
          <div class="row wrap small"><strong>${esc(nameOf(m.sender_key))}</strong><span class="faint">→</span><strong>${esc(nameOf(m.recipient_key))}</strong>${m.from_human ? '<span class="tag human">Human</span>' : ""}<span class="spacer"></span><span class="muted">${clock(m.created_at)}</span></div>
          ${m.before ? `<div class="ctx-line">${esc(nameOf(m.before.sender_key))}: ${esc(m.before.body)}</div>` : ""}
          <div style="margin:3px 0;white-space:pre-wrap;overflow-wrap:anywhere">${highlight(m.body, q)}</div>
          ${m.after ? `<div class="ctx-line">${esc(nameOf(m.after.sender_key))}: ${esc(m.after.body)}</div>` : ""}
          <div style="margin-top:6px"><a class="small" href="#/messages/${encodeURIComponent(m.sender_key)}/${encodeURIComponent(m.recipient_key)}">Open conversation</a></div></div>`).join("") : empty("No matches", "Try a shorter phrase or a wider time range.")}</section>`;
    } catch (e) { $("#hres").innerHTML = errorBox(e.message); }
  },
};

/* Teams */
pages.teams = {
  fresh: null,
  mount() { this.paint(); },
  paint() {
    if (state.page !== "teams") return;
    const o = state.overview;
    if (!o) { view.innerHTML = head("Teams") + (state.error ? errorBox(state.error) : loading()); return; }
    const teams = o.teams || [], peers = o.peers || [];
    const me = o.network && o.network.peer_id;
    const teamPanels = teams.map((t) => `<section class="panel" data-team="${esc(t.team_id)}"><header><div class="row"><h2>${esc(t.name)}</h2><span class="tag ${t.is_admin ? "admin" : ""}">${t.is_admin ? "Administrator" : "Member"}</span></div><div class="actions"><button class="btn sm" data-act="invite">Invite someone…</button><button class="btn sm danger" data-act="leave">Leave…</button></div></header>
      <div class="body small muted">${t.is_admin ? "You administer this team: you sign memberships and can revoke members." : "An administrator signs memberships. Only they can revoke a member."} ${t.members} member${t.members === 1 ? "" : "s"}.</div>
      <div data-members><div class="body"><div class="skeleton"></div></div></div></section>`).join("");
    const html = head("Teams & machines", "A team is a set of computers that trust each other. Agents on those computers can message each other end-to-end encrypted, with no cloud service.") +
      `<div class="grid even" style="margin-bottom:16px">
        <section class="panel"><header><div><h2>Create a team</h2><p>You become its administrator.</p></div></header><form class="body stack" id="create-form" style="gap:10px"><label class="field">Team name<input type="text" id="tname" placeholder="e.g. Platform team" required maxlength="80"></label><div><button class="btn primary" type="submit">Create team</button></div></form></section>
        <section class="panel"><header><div><h2>Join a team</h2><p>Paste an invitation you received from an administrator.</p></div></header><form class="body stack" id="join-form" style="gap:10px"><label class="field">Invitation<textarea id="jtok" placeholder="Paste the invitation here" required></textarea></label><div><button class="btn primary" type="submit">Join team</button></div></form></section></div>
      <div class="stack">${teamPanels || `<section class="panel">${empty("You are not in a team", "Create one above, or paste an invitation to join.")}</section>`}
      <section class="panel"><header><div><h2>This machine and peers</h2><p>Direct connections between computers in your teams.</p></div></header><div class="table-wrap"><table><thead><tr><th>Machine</th><th>Connection</th><th class="num">Last seen</th></tr></thead><tbody>
        <tr><td><strong>This machine</strong><div class="small mono faint" title="${esc(me)}">${esc(me || "")}</div></td><td>${pill("connected", "this machine")}</td><td class="num muted">now</td></tr>
        ${peers.map((p) => `<tr><td>${esc(p.label || "Peer")}<div class="small mono faint" title="${esc(p.peer_id)}">${esc(short(p.peer_id, 24))}</div></td><td>${pill(p.status)}</td><td class="num muted">${p.last_seen ? rel(p.last_seen) : "never"}</td></tr>`).join("")}</tbody></table></div></section></div>`;
    if (!setHTML(view, html, "teams")) return;
    $("#create-form").onsubmit = async (e) => {
      e.preventDefault();
      try { const t = await api("team-create", { name: $("#tname").value.trim() }); toast(`Team “${t.name}” created`); await refreshOverview(); state.lastRender.teams = null; this.paint(); this.invite(t.team_id); } catch (err) { toast(err.message, true); }
    };
    $("#join-form").onsubmit = async (e) => {
      e.preventDefault();
      try { const t = await api("team-join", { token: $("#jtok").value.trim() }); toast(`Joined “${t.name}”`); await refreshOverview(); state.lastRender.teams = null; this.paint(); } catch (err) { toast(err.message, true); }
    };
    view.querySelectorAll("[data-team]").forEach((panel) => {
      const id = panel.dataset.team;
      panel.querySelector('[data-act="invite"]').onclick = () => this.invite(id);
      panel.querySelector('[data-act="leave"]').onclick = () => this.leave(id);
      this.members(panel, id);
    });
  },
  async members(panel, id) {
    const t = (state.overview.teams || []).find((x) => x.team_id === id);
    const holder = panel.querySelector("[data-members]");
    try {
      const r = await api("team-members", { team_id: id });
      const revoked = new Set(r.revoked || []);
      holder.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Member</th><th>Role</th><th>Connection</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>${r.members.map((m) => {
        const admin = m.peer_id === t.admin_peer;
        return `<tr><td>${esc(m.member_name || "Machine")}${m.self ? ' <span class="faint">(this machine)</span>' : ""}<div class="small mono faint" title="${esc(m.peer_id)}">${esc(short(m.peer_id, 24))}</div></td><td><span class="tag ${admin ? "admin" : ""}">${admin ? "Administrator" : "Member"}</span></td><td>${m.self ? pill("connected", "this machine") : pill(m.connected ? "connected" : "offline", m.connected ? "connected" : "not connected")}</td><td class="num">${t.is_admin && !m.self && !admin ? `<button class="btn sm danger" data-revoke="${esc(m.peer_id)}">Revoke…</button>` : ""}</td></tr>`;
      }).join("")}</tbody></table></div>${revoked.size ? `<div class="body small muted">${revoked.size} revoked member${revoked.size === 1 ? "" : "s"}.</div>` : ""}`;
      holder.querySelectorAll("[data-revoke]").forEach((b) => (b.onclick = () => this.revoke(id, b.dataset.revoke)));
    } catch (e) { holder.innerHTML = `<div class="body">${errorBox(e.message)}</div>`; }
  },
  async invite(id) {
    try {
      const r = await api("team-invite", { team_id: id, ttl_seconds: 3600 });
      const dlg = $("#dlg");
      $("#dlg-title").textContent = "Invitation ready";
      $("#dlg-body").innerHTML = `<p class="muted">Send this to the person you want to add. It works once and expires ${esc(new Date(r.expires_at * 1000).toLocaleTimeString())} (in about an hour). They paste it under “Join a team”.</p><label class="field" style="margin-top:10px">Invitation<textarea readonly rows="4" id="tokbox" class="mono">${esc(r.token)}</textarea></label>`;
      $("#dlg-ok").textContent = "Copy invitation"; $("#dlg-ok").className = "btn primary";
      dlg.addEventListener("close", async () => { if (dlg.returnValue === "ok") { try { await navigator.clipboard.writeText(r.token); toast("Invitation copied"); } catch { toast("Select the text and copy it manually", true); } } }, { once: true });
      dlg.returnValue = "cancel"; dlg.showModal(); $("#tokbox").select();
    } catch (e) { toast(e.message, true); }
  },
  async leave(id) {
    const t = state.overview.teams.find((x) => x.team_id === id);
    if (!(await confirmDialog({ title: `Leave “${t.name}”?`, ok: "Leave team", danger: true, body: `<p>This machine stops talking to the team’s other computers and forgets their sessions. Existing message history stays on this machine. You need a new invitation to rejoin.</p>${t.is_admin ? '<p class="notice warn" style="margin-top:10px">You administer this team. Members will not be able to add anyone new after you leave.</p>' : ""}` }))) return;
    try { await api("team-leave", { team_id: id }); toast("Left the team"); await refreshOverview(); state.lastRender.teams = null; this.paint(); } catch (e) { toast(e.message, true); }
  },
  async revoke(team, peer) {
    if (!(await confirmDialog({ title: "Revoke this member?", ok: "Revoke member", danger: true, body: `<p>The machine <span class="mono">${esc(short(peer, 16))}</span> loses access to the team. This is signed and shared with the other members; it cannot be undone without a new invitation.</p>` }))) return;
    try { await api("team-revoke", { team_id: team, peer_id: peer }); toast("Member revoked"); await refreshOverview(); state.lastRender.teams = null; this.paint(); } catch (e) { toast(e.message, true); }
  },
};

/* Setup / onboarding */
pages.setup = {
  setupInfo: null, diag: null,
  mount() { this.load(); },
  async load() {
    try { this.setupInfo = await api("setup-status"); } catch (e) { this.setupInfo = { error: e.message }; }
    try { this.diag = await api("diagnostics"); } catch { this.diag = null; }
    this.paint();
  },
  agentEntry(id) { return ((this.setupInfo && this.setupInfo.agents) || (this.setupInfo && this.setupInfo.entries) || []).find((e) => e.agent === id); },
  paint() {
    if (state.page !== "setup") return;
    const o = state.overview;
    if (!o || !this.setupInfo) { view.innerHTML = head("Setup") + loading(); return; }
    const sessions = o.sessions || [];
    const teams = o.teams || [];
